name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -timeout 15m ./...
        env:
          # The Windows runner is elevated, so it can install a real service.
          ALGODTOP_TEST_WINSVC: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      - name: build
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o build/ . ./algodtop

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -o /dev/null .
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
          done
      - name: ascii only
        run: |
          if grep -rnP '[^\x00-\x7F]' --include='*.go' --include='*.js' --include='*.css' --include='*.html' --include='*.md' .; then
            echo "non-ASCII characters found"; exit 1
          fi

  # After the tests pass on main, publish the commit as a release: a binary
  # per platform, checksums.txt and its ed25519 signature. A release is
  # named by its commit as Go names it, v0.0.0-<UTC commit time>-<hash>,
  # and its tag drops the "v0.0.0-", so go install keeps following main.
  # The signing key is the release environment's ALGODTOP_RELEASE_KEY,
  # which only main can use. Actions here are pinned to a commit.
  release:
    needs: [test, cross]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Git ignores build/.
      OUT: build/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Name the release
        id: name
        run: |
          when=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)
          rev=$(git rev-parse --short=12 HEAD)
          echo "version=v0.0.0-$when-$rev" >> "$GITHUB_OUTPUT"
          echo "tag=$when-$rev" >> "$GITHUB_OUTPUT"
          echo "title=$(TZ=UTC git log -1 --format=%cd --date=format-local:'%Y-%m-%d %H:%M UTC') (${rev:0:8})" >> "$GITHUB_OUTPUT"
      - name: Build every platform
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          mkdir -p "$OUT"
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            os=${t%/*} arch=${t#*/}
            name=algod.top_${os}_${arch}
            [ "$os" = windows ] && name=$name.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X algod.top/internal/version.Version=$VERSION" -o "$OUT/$name" .
          done
          ls -l "$OUT"
      - name: Sign and check the signature
        env:
          RELEASE_KEY: ${{ secrets.ALGODTOP_RELEASE_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "::error::ALGODTOP_RELEASE_KEY is not set in the release environment"
            exit 1
          fi
          files=$(cd "$OUT" && ls algod.top_*)
          key=$(mktemp)
          chmod 600 "$key"
          printf '%s\n' "$RELEASE_KEY" > "$key"
          go run ./internal/release/cmd/algodtop-sign sign "$key" "$OUT" $files
          rm -f "$key"
          # The public key in internal/release must match the secret.
          go run ./internal/release/cmd/algodtop-sign verify "$OUT" $files
      # GitHub only issues attestations for public repositories on this plan.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: build/release/algod.top_*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
          TITLE: ${{ steps.name.outputs.title }}
          VERSION: ${{ steps.name.outputs.version }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          attested="Each binary has a GitHub build attestation: \`gh attestation verify algod.top_linux_amd64 --repo $GITHUB_REPOSITORY\`."
          [ "$PRIVATE" = true ] && attested="No build attestations: the repository was private when this was built."
          cat > notes.md <<NOTES
          The build of commit $GITHUB_SHA, version \`$VERSION\`. \`go install algod.top@$GITHUB_SHA\` builds the same commit.

          | File | Contents |
          |---|---|
          | \`algod.top_<os>_<arch>\` | The program for Linux, macOS and Windows on amd64 and arm64, and FreeBSD on amd64 |
          | \`checksums.txt\` | The SHA-256 of every binary |
          | \`checksums.txt.sig\` | The ed25519 signature of \`checksums.txt\` by the algod.top release key |

          Check a download with \`sha256sum -c checksums.txt --ignore-missing\`. $attested \`algod.top upgrade\` and \`algod.top remote install\` check the signature themselves.
          NOTES
          gh release create "$TAG" "$OUT"/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --latest
